[package]
name = "lib-command-replay"
version = "0.1.0"
edition = "2021"

[lib]
name = "lib_command_replay"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
# preserve_order keeps the frontend's object key order (CSS property order matters)
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }

