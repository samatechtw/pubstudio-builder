name: PR Merge (main)

# Publishes the secret-free CI images used by pubstudio's integration tests, then
# cuts a release. pubstudio builds and deploys site-api and ssg.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WORKSPACE_ROOT: .
  CACHE_SUFFIX: c # cache busting

# Cancel redundant workflow runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_job:
    name: Run Workflow?
    runs-on: ubuntu-22.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        if: ${{ github.event_name == 'push' }}
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'
          # Changes to paths must be synced with pr-merge*.yml
          paths: '[".github/workflows/pr-merge-*.yml", "apps/**", "backend/**", "libs/**", "*"]'
          paths_ignore: '["**/README.md", "skaffold*.yaml"]'

  repo-metadata:
    name: Get repo metadata
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.meta.outputs.next_version }}
      sha8: ${{ steps.meta.outputs.sha8 }}
      repo_slug: ${{ steps.meta.outputs.repo_slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        uses: ./.github/actions/repo-metadata
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-apps:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    name: Build Apps
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/env-setup
      - name: Build apps
        run: npx nx run-many -t build --projects="web*" --parallel=3 && npx nx build-hydrate web-site
      - name: Upload web-site bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-site-bundle
          path: |
            ./dist/apps/web-site/index.html
          if-no-files-found: error
          retention-days: 1
      - name: Upload hydration runtime
        uses: actions/upload-artifact@v7
        with:
          name: web-site-hydrate-bundle
          path: |
            ./dist/apps/web-site-hydrate/site.js
          if-no-files-found: error
          retention-days: 1

  build-backend:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    name: Build Backend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.90.0'
      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: pr-x86_64-unknown-linux-gnu-${{ env.CACHE_SUFFIX }}
          workspaces: backend
      - name: Build app in release mode
        run: cd backend && cargo build --release --target x86_64-unknown-linux-gnu
      - name: Copy app to target folder for Docker build
        run: |
          mkdir -p ./backend/target/linux/amd64/release
          cp ./backend/target/x86_64-unknown-linux-gnu/release/site-api ./backend/target/linux/amd64/release/site-api
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: backend-binaries-x86_64-unknown-linux-gnu
          path: |
            ./backend/target/linux/amd64/release/site-api
          if-no-files-found: error
          retention-days: 1

  build-docker-site-api-ci:
    needs: [pre_job, build-apps, build-backend, repo-metadata]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    name: Site API CI Image
    runs-on: ubuntu-22.04
    env:
      APP_NAME: site-api
      BRANCH_NAME: main
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v7
      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: backend-binaries-x86_64-unknown-linux-gnu
          path: ./backend/target/linux/amd64/release/${{env.APP_NAME}}
      - name: Download web-site bundle
        uses: actions/download-artifact@v8
        with:
          name: web-site-bundle
          path: ./dist/apps/web-site/index.html
      - name: Download hydration runtime
        uses: actions/download-artifact@v8
        with:
          name: web-site-hydrate-bundle
          path: ./dist/apps/web-site-hydrate/site.js
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Build and push CI docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ${{env.WORKSPACE_ROOT}}
          build-args: |
            "EXEC_ENV=ci"
            "PLATFORM_WEB_URL=http://127.0.0.1:3000"
            "DATABASE_URL=sqlite:site-api/db/metadata/sites_metadata.db"
            "SITE_API_PORT=3100"
            "SITE_API_HOST=0.0.0.0"
            "SITE_ADMIN_PUBLIC_"
            "S3_URL=https://da7c8f85bc450afcae564b1d7ae16d4e.r2.cloudflarestorage.com"
            "S3_ACCESS_KEY_ID=866e86eed58870d56aa4312f894a73cc"
            "S3_SECRET_ACCESS_KEY=ci"
            "MAX_BACKUPS=3"
            "MAILSENDER_API_KEY=ci"
            "SLACK_WEBHOOK_INFO_URL=ci"
            "SLACK_WEBHOOK_ERROR_URL=ci"
            "LAST_COMMIT_SHA=${{needs.repo-metadata.outputs.sha8}}"
            "RELEASE_VERSION=${{needs.repo-metadata.outputs.next_version}}"
          push: true
          file: ${{env.WORKSPACE_ROOT}}/backend/${{env.APP_NAME}}/Dockerfile
          target: stg
          platforms: linux/amd64
          tags: |
            ${{needs.repo-metadata.outputs.repo_slug}}/ci/${{env.APP_NAME}}:${{env.BRANCH_NAME}}-${{needs.repo-metadata.outputs.sha8}}-${{github.run_number}}
            ${{needs.repo-metadata.outputs.repo_slug}}/ci/${{env.APP_NAME}}:latest

  release:
    needs: build-docker-site-api-ci
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up NodeJS (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: |
          npm install -g semantic-release@23
          npm install -g @semantic-release/changelog@6
          npm install -g conventional-changelog-conventionalcommits@7
      - name: Release
        env:
          # Default GITHUB_TOKEN is OK as long as there no workflows triggered
          # on "create release" event as the latter will not be emitted.
          # See https://github.com/semantic-release/github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git branch -avv
          npx semantic-release --debug
